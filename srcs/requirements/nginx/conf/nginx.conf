# =========================
# NGINX CONFIGURATION FOR WORDPRESS
# =========================

server {
	# =========================
	# SSL/TLS SETUP
	# =========================
	# Listen on both IPv4 and IPv6
	listen 443 ssl;
	listen [::]:443 ssl;

	# Server name for 42 School (mipinhei.42.fr - replace mipinhei with your login)
	server_name ${DOMAIN_NAME};

	# SSL certificate paths (self-signed)
	ssl_certificate /etc/nginx/ssl/inception.crt;
	ssl_certificate_key /etc/nginx/ssl/inception.key;

	# =========================
	# SSL PROTOCOLS
	# =========================
	# Only allow modern, secure TLS versions
	ssl_protocols TLSv1.2 TLSv1.3;

	# =========================
	# WORDPRESS ROOT
	# =========================
	# Document root where WordPress is installed
	root /var/www/html;
	index index.php index.html;

	# =========================
	# URL REWRITING
	# =========================
	# WordPress-friendly URL routing
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# =========================
	# PHP-FPM PASSTHROUGH
	# =========================
	# Forward PHP requests to WordPress container (PHP-FPM)
	location ~ \.php$ {
		include fastcgi_params;
		include snippets/fastcgi-php.conf;
		
		# Connection to WordPress container on port 9000
		fastcgi_pass wordpress:9000;
		
		# Path handling
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}
}