# =========================
# MARIADB/MYSQL CONFIGURATION
# =========================

[mysqld]

# =========================
# FILE SYSTEM LOCATIONS
# =========================
# Directory where MySQL data files are stored
datadir = /var/lib/mysql

# UNIX socket for local connections
socket = /run/mysqld/mysqld.sock

# =========================
# NETWORK CONFIGURATION
# =========================
# Bind to all available network interfaces
# This allows containers on the inception network to connect
bind-address = 0.0.0.0

# =========================
# PORT CONFIGURATION
# =========================
# Default MySQL port (can be customized via MYSQL_PORT in .env for 42 environment)
port = 3306

# =========================
# USER
# =========================
# Run MariaDB as mysql user (non-root for security)
user = mysql