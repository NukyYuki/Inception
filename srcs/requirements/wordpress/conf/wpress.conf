; =========================
; PHP-FPM POOL CONFIGURATION FOR WORDPRESS
; =========================

[wpress]

; =========================
; USER/GROUP SETTINGS
; =========================
; Run PHP-FPM as www-data user (standard web server user)
user = www-data
group = www-data

; =========================
; LISTENING CONFIGURATION
; =========================
; Listen on TCP port 9000 (not UNIX socket)
; This allows nginx to communicate with PHP-FPM over network
listen = 9000
listen.owner = www-data
listen.group = www-data

; =========================
; PROCESS MANAGEMENT
; =========================
; Dynamic process management: scales processes based on demand
pm = dynamic

; Maximum number of child processes
pm.max_children = 5

; Number of child processes to start at startup
pm.start_servers = 2

; Minimum number of idle child processes
pm.min_spare_servers = 1

; Maximum number of idle child processes
pm.max_spare_servers = 3